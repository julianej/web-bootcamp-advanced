
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Search | TypeScript</title>
  </head>

  <body>
    <header>
      <h1>Book Search</h1>
    </header>

    <main>
      <section>
        <h2>Find a book</h2>

        <form id="search-form">
          <label for="query">Search books</label>
          <input
            type="search"
            id="query"
            name="query"
            placeholder="Enter a book title or author"
            required
          />

          <button type="submit">Search</button>
        </form>
      </section>

      <section>
        <h2>Search results</h2>
        <ul id="track-list"></ul>
      </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
